info:
  name: registrer nytt system
  type: http
  seq: 3

http:
  method: POST
  url: https://platform.tt02.altinn.no/authentication/api/v1/systemregister/vendor
  body:
    type: json
    data: |-
      {
        "id": "{{systemId}}",
        "vendor": {
          "id": "0192:{{systemLeverandoerOrgnr}}"
        },
        "name": {
          "en": "KpfSys",
          "nb": "KpfSys",
          "nn": "KpfSys"
        },
        "description": {
          "en": "KpfSys is good stuff",
          "nb": "KpfSys er bra",
          "nn": "KpfSys er morosamt"
        },
        "rights": [
          {
            "action": "read",
            "resource": [
              {
                "id": "urn:altinn:resource",
                "value": "nav_syfo_dialog"
              }
            ]
          },
          {
            "action": "subscribe",
            "resource": [
              {
                "id": "urn:altinn:resource",
                "value": "nav_syfo_dialog"
              }
            ]
          },
          {
            "action": "access",
            "resource": [
              {
                "id": "urn:altinn:resource",
                "value": "nav_syfo_oppfolgingsplan"
              }
            ]
          },
          {
            "action": "access",
            "resource": [
              {
                "id": "urn:altinn:resource",
                "value": "nav_syfo_dialogmote"
              }
            ]
          },
          {
            "action": "access",
            "resource": [
              {
                "id": "urn:altinn:resource",
                "value": "nav_syfo_oppgi-narmesteleder"
              }
            ]
          },
          {
            "action": "read",
            "resource": [
              {
                "id": "urn:altinn:resource",
                "value": "nav_syfo_oppgi-narmesteleder"
              }
            ]
          },
          {
            "action": "subscribe",
            "resource": [
              {
                "id": "urn:altinn:resource",
                "value": "nav_syfo_oppgi-narmesteleder"
              }
            ]
          }
        ],
        "clientId": [
          "{{clientId}}"
        ]
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.hasVar("clientId")){
          throw new Error("For å gjøre dette kallet må du sette variabelen clientId i requesten først. clientId settes i post-request scriptet til GET hent registrert system (eller manuelt i requesten).");
        }

        const http = require("axios");
        const tokenrespons = await http.get("https://esyfo-token.intern.dev.nav.no/systemregister")
        req.setHeader("Authorization", "Bearer "+ tokenrespons.data);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Registrer nytt system (f.eks. Bjørnesys) i Altinn sitt systemregister. For å oppdatere eksisterende system (f.eks. Tigersys), bruk `PUT oppdater system`.

  Swagger: https://docs.altinn.studio/nb/api/authentication/spec/#/SystemRegister
