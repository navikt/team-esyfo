name: Test alerts

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Test alerts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check and test PrometheusRules with promtool
        run: nais/alerts/test.sh
